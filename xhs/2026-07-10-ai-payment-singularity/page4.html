<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F6F3EC; color: #1F2421; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(30,92,79,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(30,92,79,0.05) 1px, transparent 1px); background-size: 108px 108px; }
  .wrap { position: absolute; inset: 0; padding: 100px 96px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 24px; font-size: 36px; letter-spacing: 6px; color: #6F7368; }
  .kicker .dot { width: 16px; height: 16px; border-radius: 50%; background: #1E5C4F; }
  .kicker .num { margin-left: auto; font-family: "SF Mono", Menlo, monospace; font-size: 34px; color: #9A9D90; }
  .label { margin-top: 110px; display: inline-flex; align-self: flex-start; align-items: center; background: rgba(30,92,79,0.07); border: 2px solid rgba(30,92,79,0.30); color: #1E5C4F; border-radius: 999px; padding: 16px 38px; font-size: 40px; letter-spacing: 4px; font-weight: 600; }
  h1 { margin-top: 64px; font-size: 100px; font-weight: 800; line-height: 1.3; letter-spacing: 3px; }
  h1 .accent { color: #1E5C4F; }
  .stats { margin-top: 90px; display: flex; flex-direction: column; gap: 40px; }
  .stat { background: #FFFFFF; border: 2px solid #E7E3D8; border-radius: 24px; padding: 48px 52px; display: flex; align-items: center; gap: 48px; box-shadow: 0 6px 20px rgba(31,36,33,0.04); }
  .stat .v { font-size: 76px; font-weight: 800; color: #1E5C4F; font-family: "SF Mono", Menlo, monospace; min-width: 320px; }
  .stat .k { font-size: 44px; color: #4A4E45; line-height: 1.5; letter-spacing: 2px; }
  .quote { margin-top: auto; border-left: 10px solid #1E5C4F; padding: 16px 0 16px 44px; font-size: 52px; line-height: 1.6; font-weight: 700; letter-spacing: 2px; color: #1F2421; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="kicker"><span class="dot"></span><span>热夏老友</span><span class="num">04/05</span></div>
    <div class="label">机器经济 ≠ 人类经济</div>
    <h1>它是<span class="accent">另一个物种</span></h1>
    <div class="stats">
      <div class="stat"><span class="v">$0.001</span><span class="k">交易粒度：按一次调用付费，千分之一美元也成立</span></div>
      <div class="stat"><span class="v">7×24</span><span class="k">交易频率：agent 不睡觉，全年无休在交易</span></div>
      <div class="stat"><span class="v">毫秒级</span><span class="k">决策速度：不开会、不犹豫、不走流程</span></div>
    </div>
    <div class="quote">人类经济的心跳按天算，<br>机器经济的心跳按毫秒算。</div>
  </div>
</body>
</html>
