<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 主题：tech（科技AI / web3）—— 暖白墨绿风：米白底 + 碳墨 + 深松绿 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F6F3EC; color: #1F2421; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(30,92,79,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(30,92,79,0.05) 1px, transparent 1px); background-size: 108px 108px; }
  .corner { position: absolute; top: 64px; right: 64px; width: 220px; height: 220px; border-top: 6px solid #1E5C4F; border-right: 6px solid #1E5C4F; }
  .corner2 { position: absolute; bottom: 64px; left: 64px; width: 220px; height: 220px; border-bottom: 6px solid rgba(30,92,79,0.22); border-left: 6px solid rgba(30,92,79,0.22); }
  .wrap { position: absolute; inset: 0; padding: 120px 104px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 24px; font-size: 40px; letter-spacing: 8px; color: #6F7368; }
  .kicker .dot { width: 18px; height: 18px; border-radius: 50%; background: #1E5C4F; }
  .kicker .num { margin-left: auto; font-family: "SF Mono", Menlo, monospace; letter-spacing: 2px; font-size: 36px; color: #9A9D90; }
  .title { margin-top: 300px; font-weight: 800; line-height: 1.25; font-size: 160px; letter-spacing: 6px; }
  .title .accent { color: #1E5C4F; }
  .sub { margin-top: 96px; display: inline-flex; align-items: center; gap: 28px; font-size: 54px; color: #6F7368; letter-spacing: 6px; }
  .sub .bar { width: 72px; height: 8px; background: #1E5C4F; border-radius: 4px; }
  .term { margin-top: auto; background: #FFFFFF; border: 2px solid #E7E3D8; border-radius: 20px; padding: 44px 52px; font-family: "SF Mono", Menlo, monospace; font-size: 42px; color: #9A9D90; display: flex; align-items: center; gap: 24px; box-shadow: 0 8px 28px rgba(31,36,33,0.05); }
  .term .code { color: #1E5C4F; font-weight: 700; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner"></div>
  <div class="corner2"></div>
  <div class="wrap">
    <div class="kicker"><span class="dot"></span><span>热夏老友</span><span class="num">VOL.02</span></div>
    <div class="title">把 AI 用成<br><span class="accent">复利</span></div>
    <div class="sub"><span class="bar"></span><span>对话会蒸发，文件才是本金</span></div>
    <div class="term"><span>$ MEMORY</span><span class="code">→ DISK</span><span>· COMPOUND MODE</span></div>
  </div>
</body>
</html>
