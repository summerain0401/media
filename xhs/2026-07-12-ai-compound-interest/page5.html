<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F6F3EC; color: #1F2421; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(30,92,79,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(30,92,79,0.05) 1px, transparent 1px); background-size: 108px 108px; }
  .wrap { position: absolute; inset: 0; padding: 100px 96px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 24px; font-size: 36px; letter-spacing: 6px; color: #6F7368; }
  .kicker .dot { width: 16px; height: 16px; border-radius: 50%; background: #1E5C4F; }
  .kicker .num { margin-left: auto; font-family: "SF Mono", Menlo, monospace; font-size: 34px; color: #9A9D90; }
  .label { margin-top: 110px; display: inline-flex; align-self: flex-start; align-items: center; background: rgba(30,92,79,0.07); border: 2px solid rgba(30,92,79,0.30); color: #1E5C4F; border-radius: 999px; padding: 16px 38px; font-size: 40px; letter-spacing: 4px; font-weight: 600; }
  h1 { margin-top: 64px; font-size: 100px; font-weight: 800; line-height: 1.3; letter-spacing: 3px; }
  h1 .accent { color: #1E5C4F; }
  .body-block { margin-top: 60px; font-size: 48px; line-height: 1.75; color: #4A4E45; letter-spacing: 2px; }
  .body-block strong { color: #1F2421; }
  .body-block p + p { margin-top: 40px; }
  .ask { margin-top: auto; margin-bottom: 8px; background: rgba(30,92,79,0.05); border: 2px solid rgba(30,92,79,0.30); border-radius: 24px; padding: 44px 52px; font-size: 48px; line-height: 1.6; font-weight: 700; letter-spacing: 2px; color: #1F2421; }
  .ask .light { display: block; margin-top: 24px; font-size: 36px; font-weight: 400; color: #6F7368; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="kicker"><span class="dot"></span><span>热夏老友</span><span class="num">05/05</span></div>
    <div class="label">最小行动</div>
    <h1>五分钟，存下<br>第一笔<span class="accent">本金</span></h1>
    <div class="body-block">
      <p>建一个文档，写三件事：<strong>你在做什么、三条你的规则、一个踩过的坑。</strong>下次对话开头，先喂给它。</p>
      <p>这些文件不绑定任何一家 AI——哪天换了工具，喂进去，新 AI 秒变老员工。</p>
    </div>
    <div class="ask">会用 AI 人人都会，你攒下的那套文件，才是偷不走的。<span class="light">收藏这篇，今天就建档 📁 · 关注 @热夏老友</span></div>
  </div>
</body>
</html>
