<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F6F3EC; color: #1F2421; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(30,92,79,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(30,92,79,0.05) 1px, transparent 1px); background-size: 108px 108px; }
  .wrap { position: absolute; inset: 0; padding: 100px 96px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 24px; font-size: 36px; letter-spacing: 6px; color: #6F7368; }
  .kicker .dot { width: 16px; height: 16px; border-radius: 50%; background: #1E5C4F; }
  .kicker .num { margin-left: auto; font-family: "SF Mono", Menlo, monospace; font-size: 34px; color: #9A9D90; }
  .label { margin-top: 90px; display: inline-flex; align-self: flex-start; align-items: center; background: rgba(30,92,79,0.07); border: 2px solid rgba(30,92,79,0.30); color: #1E5C4F; border-radius: 999px; padding: 16px 38px; font-size: 40px; letter-spacing: 4px; font-weight: 600; }
  h1 { margin-top: 56px; font-size: 92px; font-weight: 800; line-height: 1.3; letter-spacing: 3px; }
  h1 .accent { color: #1E5C4F; }
  .body-block { margin-top: 64px; font-size: 50px; line-height: 1.75; color: #4A4E45; letter-spacing: 2px; }
  .body-block strong { color: #1F2421; }
  .body-block p + p { margin-top: 40px; }
  .quote { margin-top: auto; border-left: 10px solid #1E5C4F; padding: 16px 0 16px 44px; font-size: 48px; line-height: 1.55; font-weight: 700; letter-spacing: 2px; color: #1F2421; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="kicker"><span class="dot"></span><span>热夏老友</span><span class="num">02/05</span></div>
    <div class="label">一个命题</div>
    <h1>你在用<span class="accent">单利</span><br>还是复利</h1>
    <div class="body-block">
      <p>单利：每次对话，价值当场兑现，窗口一关就归零。<strong>第 100 次用，和第 1 次一样，从零开始。</strong></p>
      <p>复利：每次用完，把有价值的东西存下来。<strong>第 100 次使用，站在前 99 次的积累上。</strong></p>
    </div>
    <div class="quote">差距不在会不会用，在留没留下。</div>
  </div>
</body>
</html>
