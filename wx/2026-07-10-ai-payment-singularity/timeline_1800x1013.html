<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --accent: #1E5C4F; --ink: #1F2421; --sub: #6F7368; --line: #E7E3D8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1800px; height: 1013px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F6F3EC; color: var(--ink); position: relative; }
  .wrap { position: absolute; inset: 0; padding: 100px 110px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; gap: 32px; }
  .head h1 { font-size: 64px; font-weight: 800; letter-spacing: 3px; }
  .head .src { margin-left: auto; font-size: 32px; color: var(--sub); letter-spacing: 3px; }
  .tl { position: relative; flex: 1; margin-top: 40px; }
  .axis { position: absolute; left: 0; right: 0; top: 50%; height: 6px; background: var(--line); border-radius: 3px; }
  .node { position: absolute; top: 50%; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); }
  .node::after { content: ""; position: absolute; inset: -10px; border: 3px solid var(--accent); border-radius: 50%; opacity: 0.3; }
  .tag { position: absolute; transform: translateX(-50%); width: 320px; text-align: center; }
  .tag.up { bottom: 56%; } .tag.down { top: 56%; }
  .tag .t { font-size: 34px; color: var(--accent); font-weight: 700; font-family: "SF Mono", Menlo, monospace; }
  .tag .n { margin-top: 12px; font-size: 38px; line-height: 1.45; font-weight: 600; }
  .tag .d { margin-top: 8px; font-size: 30px; color: var(--sub); line-height: 1.4; }
  .foot { display: flex; align-items: center; gap: 20px; font-size: 34px; color: var(--sub); letter-spacing: 4px; }
  .foot .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>2025：AI 支付基础设施密集落地</h1><span class="src">据各公司公开发布信息</span></div>
    <div class="tl">
      <div class="axis"></div>
      <div class="node" style="left:8%"></div>
      <div class="tag up" style="left:8%"><div class="t">4月</div><div class="n">Visa · 万事达</div><div class="d">AI 代理支付方案</div></div>
      <div class="node" style="left:29%"></div>
      <div class="tag down" style="left:29%"><div class="t">5月</div><div class="n">Coinbase x402</div><div class="d">唤醒 HTTP 402 状态码</div></div>
      <div class="node" style="left:50%"></div>
      <div class="tag up" style="left:50%"><div class="t">9月</div><div class="n">Google AP2</div><div class="d">60+ 机构参与</div></div>
      <div class="node" style="left:71%"></div>
      <div class="tag down" style="left:71%"><div class="t">9月</div><div class="n">OpenAI × Stripe</div><div class="d">ChatGPT 内直接下单</div></div>
      <div class="node" style="left:92%"></div>
      <div class="tag up" style="left:92%"><div class="t">2025</div><div class="n">支付宝</div><div class="d">向 AI 开放支付接口</div></div>
    </div>
    <div class="foot"><span class="dot"></span><span>热夏老友</span></div>
  </div>
</body>
</html>
