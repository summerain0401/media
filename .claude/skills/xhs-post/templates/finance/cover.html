<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 主题：finance（金融经济 / 商业财经）—— 米白纸感 + 藏蓝 + 金 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; background: #F7F4EC; color: #1A2B4A; position: relative; }
  .frame { position: absolute; inset: 44px; border: 3px solid #1A2B4A; }
  .frame2 { position: absolute; inset: 56px; border: 1px solid rgba(26,43,74,0.35); }
  .wrap { position: absolute; inset: 0; padding: 150px 120px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: baseline; justify-content: space-between; font-size: 40px; letter-spacing: 10px; color: #1A2B4A; border-bottom: 3px solid #1A2B4A; padding-bottom: 36px; }
  .kicker .num { font-size: 34px; letter-spacing: 4px; color: #8A7A45; }
  .tag { margin-top: 220px; align-self: flex-start; background: #1A2B4A; color: #F7F4EC; font-size: 40px; letter-spacing: 8px; padding: 18px 44px; }
  .title { margin-top: 80px; font-weight: 900; line-height: 1.3; font-size: 150px; letter-spacing: 4px; }
  .title .accent { color: #B8912F; }
  .sub { margin-top: 90px; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 52px; color: #4A5568; letter-spacing: 5px; line-height: 1.6; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; border-top: 3px solid #1A2B4A; padding-top: 40px; font-size: 38px; letter-spacing: 6px; color: #8A7A45; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="frame2"></div>
  <div class="wrap">
    <div class="kicker"><span>热夏老友</span><span class="num">NO.XX</span></div>
    <div class="tag">栏目标签</div>
    <!-- 主标题 2-3 行，数字或关键词包 accent -->
    <div class="title">这轮行情里<br>钱在往<span class="accent">哪</span>流</div>
    <div class="sub">副文案：一句话点出读者利益<br>第二行可继续补充悬念</div>
    <div class="foot"><span>理性 · 数据 · 判断</span><span>每周更新</span></div>
  </div>
</body>
</html>
