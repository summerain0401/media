<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 主题：warm（社会学 / 生活感悟）—— 奶油底 + 暖橘 + 大留白 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #FAF3E7; color: #3D3229; position: relative; }
  .blob { position: absolute; right: -260px; top: -200px; width: 820px; height: 820px; border-radius: 50%; background: rgba(224,122,63,0.14); }
  .blob2 { position: absolute; left: -300px; bottom: -320px; width: 900px; height: 900px; border-radius: 50%; background: rgba(122,139,110,0.12); }
  .wrap { position: absolute; inset: 0; padding: 130px 110px; display: flex; flex-direction: column; }
  .kicker { display: inline-flex; align-self: flex-start; align-items: center; gap: 22px; font-size: 40px; letter-spacing: 6px; color: #8C7B68; }
  .kicker .line { width: 64px; height: 5px; background: #E07A3F; border-radius: 3px; }
  .title { margin-top: 340px; font-weight: 800; line-height: 1.45; font-size: 116px; letter-spacing: 4px; }
  .title .mark { background: linear-gradient(transparent 62%, rgba(224,122,63,0.38) 62%); }
  .sub { margin-top: 100px; font-size: 52px; color: #8C7B68; letter-spacing: 4px; line-height: 1.7; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 28px; font-size: 40px; color: #8C7B68; letter-spacing: 4px; }
  .foot .dot { width: 14px; height: 14px; border-radius: 50%; background: #E07A3F; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="blob2"></div>
  <div class="wrap">
    <div class="kicker"><span class="line"></span><span>热夏老友</span></div>
    <!-- 主标题 2-3 行，重点短语用 .mark 荧光笔效果 -->
    <!-- 主标题 2-3 行，每行 ≤7 字，重点短语用 .mark 荧光笔效果；引号用「」 -->
    <div class="title">30岁以后，<br>我不再攒<br><span class="mark">「有用」</span>的朋友</div>
    <div class="sub">副文案：一句温和但有锋芒的话</div>
    <div class="foot"><span class="dot"></span><span>写给同路人 · VOL.XX</span></div>
  </div>
</body>
</html>
