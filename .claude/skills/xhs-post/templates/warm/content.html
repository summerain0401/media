<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 主题：warm 内容页 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1242px; height: 1656px; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #FAF3E7; color: #3D3229; position: relative; }
  .blob { position: absolute; right: -300px; bottom: -280px; width: 780px; height: 780px; border-radius: 50%; background: rgba(224,122,63,0.10); }
  .wrap { position: absolute; inset: 0; padding: 120px 110px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 22px; font-size: 36px; letter-spacing: 5px; color: #8C7B68; }
  .kicker .line { width: 56px; height: 5px; background: #E07A3F; border-radius: 3px; }
  .kicker .num { margin-left: auto; font-size: 34px; color: #B3A28C; }
  .label { margin-top: 120px; font-size: 44px; letter-spacing: 5px; color: #E07A3F; font-weight: 700; }
  h1 { margin-top: 48px; font-size: 96px; font-weight: 800; line-height: 1.4; letter-spacing: 3px; }
  h1 .mark { background: linear-gradient(transparent 62%, rgba(224,122,63,0.38) 62%); }
  .body-block { margin-top: 80px; font-size: 52px; line-height: 1.9; color: #5C4F42; letter-spacing: 2px; }
  .body-block strong { color: #3D3229; }
  .card-list { margin-top: 80px; display: flex; flex-direction: column; gap: 40px; }
  .card { background: #FFFFFF; border-radius: 28px; padding: 48px 52px; font-size: 48px; line-height: 1.7; color: #5C4F42; box-shadow: 0 6px 24px rgba(61,50,41,0.06); display: flex; gap: 30px; }
  .card .no { color: #E07A3F; font-weight: 800; }
  .quote { margin-top: auto; text-align: center; font-size: 56px; line-height: 1.7; font-weight: 700; letter-spacing: 3px; padding: 0 40px; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="wrap">
    <div class="kicker"><span class="line"></span><span>热夏老友</span><span class="num">02/05</span></div>
    <div class="label">◐ 小节标签</div>
    <h1>本页大标题<br>重点<span class="mark">画线强调</span></h1>
    <div class="body-block">正文块：像和朋友说话，句子可以长一点，<strong>但真心话加粗。</strong></div>
    <div class="card-list">
      <div class="card"><span class="no">01</span><span>卡片条目一</span></div>
      <div class="card"><span class="no">02</span><span>卡片条目二</span></div>
    </div>
    <div class="quote">「 居中金句，本页最柔软或最扎心的一句 」</div>
  </div>
</body>
</html>
